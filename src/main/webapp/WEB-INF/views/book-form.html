<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>thêm sách</title>

    <style>

        .error {
            color: red;
        }

        .field {
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

<h1 th:text="${book.id == null}
? 'Thêm sách'
: 'Cập nhật sách'"></h1>

<form
        th:action="${book.id == null}
        ? @{/books/save}
        : @{/books/update}"

        th:object="${book}"
        method="post"
>

    <input type="hidden" th:field="*{id}">

    <div class="field">

        <label>Tên sách</label>

        <input type="text" th:field="*{title}">

        <span class="error"
              th:errors="*{title}"></span>

    </div>

    <div class="field">

        <label>tác giả</label>

        <input type="text" th:field="*{author}">

        <span class="error"
              th:errors="*{author}"></span>

    </div>

    <div class="field">

        <label>Số lượng</label>

        <input type="text" th:field="*{quantity}">

        <span class="error"
              th:errors="*{quantity}"></span>

    </div>

    <div class="field">

        <label>hình ảnh</label>

        <input type="text" th:field="*{coverImage}">

        <span class="error"
              th:errors="*{coverImage}"></span>

    </div>

    <button type="submit">
        Lưu
    </button>

</form>

</body>
</html>
